<svg width="1200" height="270" viewBox="0 0 1200 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="agBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110726"/>
      <stop offset="100%" stop-color="#050310"/>
    </linearGradient>
    <linearGradient id="agArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="agLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="agGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="270" rx="18" fill="url(#agBg)" stroke="url(#agLine)" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="40" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.5" fill="#e879f9">✦ CONTRIBUTION &amp; ENGINEERING VELOCITY // TELEMETRY GRAPH</text>
  <rect x="980" y="20" width="184" height="28" rx="14" fill="#090416" stroke="#39ff88" stroke-opacity="0.5"/>
  <circle cx="998" cy="34" r="4" fill="#39ff88">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="1080" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#39ff88">VELOCITY: OPTIMAL</text>

  <!-- Grid Lines -->
  <g stroke="#8b5cf6" stroke-opacity="0.14" stroke-dasharray="4 6">
    <line x1="60" y1="75" x2="1150" y2="75"/>
    <line x1="60" y1="115" x2="1150" y2="115"/>
    <line x1="60" y1="155" x2="1150" y2="155"/>
    <line x1="60" y1="195" x2="1150" y2="195"/>
    <line x1="60" y1="225" x2="1150" y2="225"/>
  </g>

  <!-- Area Fill Under Spline -->
  <path d="M 60,195 C 130,180 170,120 240,135 C 310,150 350,95 420,108 C 490,120 530,160 600,115 C 670,70 710,130 780,92 C 850,54 890,110 960,82 C 1030,54 1090,90 1150,68 L 1150,225 L 60,225 Z" fill="url(#agArea)"/>

  <!-- Glowing Spline Curve -->
  <path d="M 60,195 C 130,180 170,120 240,135 C 310,150 350,95 420,108 C 490,120 530,160 600,115 C 670,70 710,130 780,92 C 850,54 890,110 960,82 C 1030,54 1090,90 1150,68" fill="none" stroke="url(#agLine)" stroke-width="3.2" filter="url(#agGlow)"/>

  <!-- Data Points -->
  <g fill="#050310" stroke="#38bdf8" stroke-width="2.5" filter="url(#agGlow)">
    <circle cx="60" cy="195" r="5"/>
    <circle cx="240" cy="135" r="5"/>
    <circle cx="420" cy="108" r="5" stroke="#a855f7"/>
    <circle cx="600" cy="115" r="5" stroke="#a855f7"/>
    <circle cx="780" cy="92" r="5" stroke="#e879f9"/>
    <circle cx="960" cy="82" r="5" stroke="#e879f9"/>
    <circle cx="1150" cy="68" r="6" fill="#39ff88" stroke="#ffffff">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- X-Axis Labels -->
  <g font-family="Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="60" y="248">JAN</text>
    <text x="159" y="248">FEB</text>
    <text x="258" y="248">MAR</text>
    <text x="357" y="248">APR</text>
    <text x="456" y="248">MAY</text>
    <text x="555" y="248">JUN</text>
    <text x="654" y="248">JUL</text>
    <text x="753" y="248">AUG</text>
    <text x="852" y="248">SEP</text>
    <text x="951" y="248">OCT</text>
    <text x="1050" y="248">NOV</text>
    <text x="1145" y="248" fill="#e879f9" font-weight="700">NOW</text>
  </g>
</svg>
