<svg width="860" height="136" viewBox="0 0 860 136" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15092e"/>
      <stop offset="100%" stop-color="#070312"/>
    </linearGradient>
    <linearGradient id="apBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .barA { animation: bounce 1.1s ease-in-out infinite; }
      .barB { animation: bounce 1.5s ease-in-out infinite 0.2s; }
      .barC { animation: bounce 0.9s ease-in-out infinite 0.4s; }
      .barD { animation: bounce 1.3s ease-in-out infinite 0.6s; }
      @keyframes bounce { 0%,100%{ opacity:0.35; } 50%{ opacity:1; } }
    </style>
  </defs>

  <rect x="2" y="2" width="856" height="132" rx="20" fill="url(#apBg)" stroke="url(#apBorder)" stroke-width="1.5"/>

  <!-- Spinning Holo Disc -->
  <g transform="translate(72, 68)">
    <circle cx="0" cy="0" r="44" fill="#090416" stroke="url(#apBorder)" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="14 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="10 6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="#e879f9"/>
  </g>

  <!-- Track Metadata -->
  <circle cx="148" cy="36" r="4.5" fill="#1DB954">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="160" y="40" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2.5" fill="#39ff88">NOW STREAMING // SPOTIFY LOFI DECK</text>
  <text x="144" y="68" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="19" fill="#f5f3ff">Midnight Synthwave &amp; Deep Focus Beats</text>
  <text x="144" y="88" font-family="Consolas, monospace" font-size="12" fill="#a78bfa">STUBBORN.FM  ·  Late-Night Flow State  ·  320kbps Lossless</text>

  <!-- Progress Bar -->
  <rect x="144" y="104" width="440" height="6" rx="3" fill="#1e103c"/>
  <rect x="144" y="104" width="295" height="6" rx="3" fill="url(#apBorder)"/>
  <circle cx="439" cy="107" r="5" fill="#f5f3ff"/>
  <text x="598" y="111" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">02:48 / 04:12</text>

  <!-- Right Visualizer Equalizer -->
  <g transform="translate(680, 38)">
    <rect class="barA" x="0" y="18" width="6" height="44" rx="3" fill="#e879f9"/>
    <rect class="barB" x="12" y="6" width="6" height="56" rx="3" fill="#d946ef"/>
    <rect class="barC" x="24" y="24" width="6" height="38" rx="3" fill="#a855f7"/>
    <rect class="barD" x="36" y="0" width="6" height="62" rx="3" fill="#8b5cf6"/>
    <rect class="barA" x="48" y="14" width="6" height="48" rx="3" fill="#6366f1"/>
    <rect class="barC" x="60" y="4" width="6" height="58" rx="3" fill="#3b82f6"/>
    <rect class="barB" x="72" y="20" width="6" height="42" rx="3" fill="#38bdf8"/>
    <rect class="barD" x="84" y="8" width="6" height="54" rx="3" fill="#39ff88"/>
    <rect class="barA" x="96" y="22" width="6" height="40" rx="3" fill="#38bdf8"/>
    <rect class="barC" x="108" y="12" width="6" height="50" rx="3" fill="#a855f7"/>
    <rect class="barB" x="120" y="26" width="6" height="36" rx="3" fill="#e879f9"/>
    <rect class="barD" x="132" y="16" width="6" height="46" rx="3" fill="#f472b6"/>
  </g>
</svg>
