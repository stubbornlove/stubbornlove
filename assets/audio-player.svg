<svg width="900" height="164" viewBox="0 0 900 164" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21072c"/>
      <stop offset="50%" stop-color="#120520"/>
      <stop offset="100%" stop-color="#07020e"/>
    </linearGradient>
    <linearGradient id="apBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <style>
      .barA { animation: bounce 1.1s ease-in-out infinite; }
      .barB { animation: bounce 1.5s ease-in-out infinite 0.2s; }
      .barC { animation: bounce 0.9s ease-in-out infinite 0.4s; }
      .barD { animation: bounce 1.3s ease-in-out infinite 0.6s; }
      @keyframes bounce { 0%,100%{ opacity:0.35; } 50%{ opacity:1; } }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="160" rx="22" fill="url(#apBg)" stroke="url(#apBorder)" stroke-width="1.6"/>

  <!-- Spinning Velvet & Rose-Gold Vinyl Record -->
  <g transform="translate(82, 82)">
    <circle cx="0" cy="0" r="54" fill="#090312" stroke="url(#apBorder)" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ff2a85" stroke-width="1" stroke-dasharray="16 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#fde047" stroke-width="1.2" stroke-dasharray="12 6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="16" fill="#2d0822" stroke="#fda4af" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ff2a85">❤️</text>
  </g>

  <!-- Track Metadata & Poetic Lyrics -->
  <circle cx="164" cy="34" r="4.5" fill="#ff2a85">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="178" y="38" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2.5" fill="#fda4af">ON REPEAT // MIDNIGHT VINYL SESSION</text>

  <text x="160" y="66" font-family="'Segoe UI', Georgia, serif" font-weight="800" font-size="20" fill="#ffe4e6">Stubborn Love — The Lumineers <tspan font-size="14" font-weight="400" fill="#fda4af">(Midnight Rain &amp; Lofi Edit)</tspan></text>

  <text x="160" y="92" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#fde047">♪ "Keep your head up, keep your love... I'll stand by you when the night gets cold." ♪</text>

  <!-- Progress Bar -->
  <rect x="160" y="114" width="460" height="6" rx="3" fill="#2a0d38"/>
  <rect x="160" y="114" width="320" height="6" rx="3" fill="url(#apBorder)"/>
  <circle cx="480" cy="117" r="5.5" fill="#ffe4e6"/>
  <text x="634" y="121" font-family="Consolas, monospace" font-size="11.5" fill="#fda4af">02:54 / 04:39</text>

  <text x="160" y="142" font-family="Consolas, monospace" font-size="11" fill="#c4b5fd">🎧 Best experienced with earphones at 2:00 AM  ·  Curated by Yogesh</text>

  <!-- Right Visualizer Equalizer -->
  <g transform="translate(720, 48)">
    <rect class="barA" x="0" y="20" width="6" height="48" rx="3" fill="#ff2a85"/>
    <rect class="barB" x="12" y="6" width="6" height="62" rx="3" fill="#fb7185"/>
    <rect class="barC" x="24" y="24" width="6" height="44" rx="3" fill="#fda4af"/>
    <rect class="barD" x="36" y="0" width="6" height="68" rx="3" fill="#fde047"/>
    <rect class="barA" x="48" y="14" width="6" height="54" rx="3" fill="#f472b6"/>
    <rect class="barC" x="60" y="4" width="6" height="64" rx="3" fill="#e879f9"/>
    <rect class="barB" x="72" y="20" width="6" height="48" rx="3" fill="#c084fc"/>
    <rect class="barD" x="84" y="8" width="6" height="60" rx="3" fill="#ff2a85"/>
    <rect class="barA" x="96" y="22" width="6" height="46" rx="3" fill="#fde047"/>
    <rect class="barC" x="108" y="12" width="6" height="56" rx="3" fill="#fda4af"/>
    <rect class="barB" x="120" y="26" width="6" height="42" rx="3" fill="#e879f9"/>
    <rect class="barD" x="132" y="16" width="6" height="52" rx="3" fill="#ff2a85"/>
  </g>
</svg>
