<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="laCardL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#270629"/>
      <stop offset="100%" stop-color="#09020f"/>
    </linearGradient>
    <linearGradient id="laCardR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17072c"/>
      <stop offset="100%" stop-color="#08020e"/>
    </linearGradient>
    <linearGradient id="laBorderRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="laBorderCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="#05020c"/>

  <!-- ================= LEFT: HOW I LOVE & LIVE ================= -->
  <g transform="translate(20, 14)">
    <rect width="564" height="232" rx="20" fill="url(#laCardL)" stroke="url(#laBorderRose)" stroke-width="1.6"/>
    <text x="28" y="42" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="900" font-size="22" fill="#ffe4e6">🌹 How I Love &amp; Live ("stubbornlove")</text>

    <rect x="28" y="56" width="508" height="32" rx="8" fill="#330829" stroke="#ff2a85" stroke-opacity="0.5"/>
    <text x="282" y="77" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="14.5" fill="#fde047">"I want to be the parts of the book you underline ❤️"</text>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#ffe4e6">
      <text x="28" y="118"><tspan fill="#ff2a85" font-weight="700">♥  Love Language:</tspan> <tspan font-style="italic" fill="#fbcfe8">Remembering every tiny detail you once mentioned</tspan></text>
      <text x="28" y="150"><tspan fill="#fde047" font-weight="700">🌙  Perfect Escape:</tspan> <tspan font-style="italic" fill="#fbcfe8">Late-night drives, rain on glass, coffee &amp; slow songs</tspan></text>
      <text x="28" y="182"><tspan fill="#39ff88" font-weight="700">🛡️  My Promise:</tspan> <tspan font-style="italic" fill="#fbcfe8">Protecting your peace &amp; never letting you doubt your worth</tspan></text>
      <text x="28" y="212"><tspan fill="#e879f9" font-weight="700">💍  Standard:</tspan> <tspan font-style="italic" fill="#fef08a">1000% devotion — in a world of casual, I choose forever.</tspan></text>
    </g>
  </g>

  <!-- ================= RIGHT: THE AMBITION & CRAFT ================= -->
  <g transform="translate(616, 14)">
    <rect width="564" height="232" rx="20" fill="url(#laCardR)" stroke="url(#laBorderCyan)" stroke-width="1.6"/>
    <text x="28" y="42" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="900" font-size="22" fill="#ffe4e6">⚡ The Ambition &amp; Engineering Craft</text>

    <rect x="28" y="56" width="508" height="32" rx="8" fill="#1d0938" stroke="#e879f9" stroke-opacity="0.5"/>
    <text x="282" y="77" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="14.5" fill="#7dd3fc">"Know your worth, darling — build an empire, keep your heart soft."</text>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#ffe4e6">
      <text x="28" y="118"><tspan fill="#38bdf8" font-weight="700">✨  Luxury Frontend:</tspan> <tspan font-style="italic" fill="#e0f2fe">React, Next.js, TypeScript &amp; 60fps fluid motion</tspan></text>
      <text x="28" y="150"><tspan fill="#e879f9" font-weight="700">🤖  Autonomous AI:</tspan> <tspan font-style="italic" fill="#f5d0fe">Python neural agents, smart media &amp; cloud bots</tspan></text>
      <text x="28" y="182"><tspan fill="#fde047" font-weight="700">🚀  Full-Stack Scale:</tspan> <tspan font-style="italic" fill="#fef08a">Node.js, PostgreSQL, Redis, Docker &amp; AWS</tspan></text>
      <text x="28" y="212"><tspan fill="#ff2a85" font-weight="700">🔥  Life Rule:</tspan> <tspan font-style="italic" fill="#fda4af">Never half-love. Never ship ugly. Zero compromises.</tspan></text>
    </g>
  </g>
</svg>
