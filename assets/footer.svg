<svg width="1200" height="160" viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ftWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0522"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0d0522"/>
    </linearGradient>
    <linearGradient id="ftWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050310"/>
      <stop offset="50%" stop-color="#190a36"/>
      <stop offset="100%" stop-color="#050310"/>
    </linearGradient>
    <linearGradient id="ftStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .w1 { animation: waveMove1 7s ease-in-out infinite; }
      .w2 { animation: waveMove2 9s ease-in-out infinite; }
      @keyframes waveMove1 { 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(8px);} }
      @keyframes waveMove2 { 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(-6px);} }
    </style>
  </defs>

  <rect width="1200" height="160" fill="#050310"/>

  <path class="w1" d="M0,55 C200,15 400,95 600,45 C800,-5 1000,85 1200,40 L1200,160 L0,160 Z" fill="url(#ftWave1)" opacity="0.8"/>
  <path class="w2" d="M0,75 C240,115 420,35 600,75 C780,115 980,35 1200,75 L1200,160 L0,160 Z" fill="url(#ftWave2)"/>
  <path class="w1" d="M0,55 C200,15 400,95 600,45 C800,-5 1000,85 1200,40" fill="none" stroke="url(#ftStroke)" stroke-width="2"/>

  <text x="600" y="114" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="13" letter-spacing="5" fill="#e879f9">✦ STUBBORN // YOGESH MAHAWAR // ARCHITECTED FOR 2035 ✦</text>
  <text x="600" y="138" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" letter-spacing="1.5" fill="#94a3b8">Built with React-brain, CSS-heart &amp; zero-compromise engineering.</text>
</svg>
