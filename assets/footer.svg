<svg width="1200" height="175" viewBox="0 0 1200 175" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ftWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14041f"/>
      <stop offset="50%" stop-color="#3b0a37"/>
      <stop offset="100%" stop-color="#14041f"/>
    </linearGradient>
    <linearGradient id="ftWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05020c"/>
      <stop offset="50%" stop-color="#1f072b"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>
    <linearGradient id="ftStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="75%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .w1 { animation: waveMove1 7s ease-in-out infinite; }
      .w2 { animation: waveMove2 9s ease-in-out infinite; }
      @keyframes waveMove1 { 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(8px);} }
      @keyframes waveMove2 { 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(-6px);} }
    </style>
  </defs>

  <rect width="1200" height="175" fill="#05020c"/>

  <path class="w1" d="M0,55 C200,15 400,95 600,45 C800,-5 1000,85 1200,40 L1200,175 L0,175 Z" fill="url(#ftWave1)" opacity="0.85"/>
  <path class="w2" d="M0,78 C240,118 420,38 600,78 C780,118 980,38 1200,78 L1200,175 L0,175 Z" fill="url(#ftWave2)"/>
  <path class="w1" d="M0,55 C200,15 400,95 600,45 C800,-5 1000,85 1200,40" fill="none" stroke="url(#ftStroke)" stroke-width="2.2"/>

  <text x="600" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16" letter-spacing="1.5" fill="#ffe4e6">"I want to be the parts of the book you underline ❤️"</text>
  <text x="600" y="144" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="12" letter-spacing="4" fill="#fda4af">✦ YOGESH MAHAWAR  ·  @STUBBORNLOVE  ·  CRAFTED WITH HEART &amp; GENIUS ✦</text>
</svg>
