<svg width="380" height="78" viewBox="0 0 380 78" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="btnGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .btnPulse { animation: btnPulse 2.4s ease-in-out infinite; }
      @keyframes btnPulse { 0%,100%{ opacity:0.6;} 50%{ opacity:1;} }
    </style>
  </defs>
  <rect class="btnPulse" x="4" y="4" width="372" height="70" rx="20" fill="none" stroke="url(#btnGrad)" stroke-width="2.2" filter="url(#btnGlow)"/>
  <rect x="4" y="4" width="372" height="70" rx="20" fill="#14041d" fill-opacity="0.92"/>
  <rect x="4" y="4" width="372" height="70" rx="20" fill="none" stroke="url(#btnGrad)" stroke-width="1.6"/>
  <text x="190" y="45" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="16.5" letter-spacing="2.5" fill="#ffe4e6">DON&#8217;T BE SHY — SAY HELLO ❤️ →</text>
</svg>
