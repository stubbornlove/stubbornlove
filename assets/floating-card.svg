<svg width="380" height="220" viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0b3d"/>
      <stop offset="100%" stop-color="#0a0616"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
    <style>
      .hover3d { animation: hover3d 5s ease-in-out infinite; transform-origin: 190px 110px; }
      @keyframes hover3d {
        0%,100% { transform: translateY(0) rotate(-1.2deg); }
        50% { transform: translateY(-16px) rotate(1.2deg); }
      }
    </style>
  </defs>
  <g class="hover3d" filter="url(#cardShadow)">
    <rect x="20" y="20" width="340" height="180" rx="18" fill="url(#cardFace)" stroke="url(#cardBorder)" stroke-width="1.6"/>
    <rect x="20" y="20" width="340" height="180" rx="18" fill="#ffffff" opacity="0.02"/>
    <circle cx="60" cy="60" r="12" fill="#e879f9" opacity="0.85"/>
    <text x="90" y="65" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#f5f3ff">Project Nova</text>
    <text x="60" y="100" font-family="Consolas, monospace" font-size="12" fill="#a78bfa">React · TypeScript · Next.js</text>
    <line x1="60" y1="115" x2="320" y2="115" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <text x="60" y="140" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5f5">A real-time UI system built for</text>
    <text x="60" y="158" font-family="Arial, sans-serif" font-size="12.5" fill="#cbd5f5">speed, clarity and scale.</text>
    <rect x="60" y="172" width="70" height="20" rx="6" fill="none" stroke="#38bdf8"/>
    <text x="95" y="186" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7dd3fc">LIVE</text>
  </g>
</svg>
