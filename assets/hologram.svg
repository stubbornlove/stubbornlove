<svg width="420" height="260" viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="holoBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <pattern id="holoScan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#7dd3fc" opacity="0.05"/>
    </pattern>
    <style>
      .flicker { animation: flicker 3.6s ease-in-out infinite; }
      .scanMove { animation: scanMove 2.8s linear infinite; }
      @keyframes flicker { 0%,19%,21%,100%{ opacity:1;} 20%{ opacity:0.7;} }
      @keyframes scanMove { 0%{ transform:translateY(0);} 100%{ transform:translateY(220px);} }
    </style>
  </defs>

  <rect width="420" height="260" fill="#050310"/>
  <g class="flicker">
    <polygon points="60,220 210,20 360,220" fill="url(#holoGrad)" opacity="0.5" filter="url(#holoBlur)"/>
    <polygon points="60,220 210,20 360,220" fill="none" stroke="#7dd3fc" stroke-width="1.4"/>
    <line x1="60" y1="220" x2="360" y2="220" stroke="#e879f9" stroke-width="1.4"/>
    <circle cx="210" cy="150" r="55" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.6"/>
    <circle cx="210" cy="150" r="30" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  </g>
  <rect x="60" y="20" width="300" height="200" fill="url(#holoScan)"/>
  <rect class="scanMove" x="60" y="20" width="300" height="6" fill="#e879f9" opacity="0.25"/>
  <text x="210" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="11" letter-spacing="4" fill="#a78bfa">RENDERING UI SYSTEM...</text>
</svg>
