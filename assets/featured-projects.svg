<svg width="1200" height="290" viewBox="0 0 1200 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fpCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160a33"/>
      <stop offset="100%" stop-color="#070312"/>
    </linearGradient>
    <linearGradient id="fpBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="fpBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="fpBorder3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff88"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="fpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .cardFloat1 { animation: cf 6s ease-in-out infinite; }
      .cardFloat2 { animation: cf 6s ease-in-out infinite 1.5s; }
      .cardFloat3 { animation: cf 6s ease-in-out infinite 3s; }
      @keyframes cf { 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(-6px);} }
    </style>
  </defs>

  <rect width="1200" height="290" rx="16" fill="#050310"/>

  <!-- ================= CARD 1: VIDYAPEETH EDTECH PLATFORM ================= -->
  <g class="cardFloat1" transform="translate(20, 18)">
    <rect width="368" height="254" rx="18" fill="url(#fpCard)" stroke="url(#fpBorder1)" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="14" fill="#2e1065" stroke="#e879f9" stroke-width="1.5"/>
    <text x="38" y="43" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#e879f9">01</text>
    <rect x="268" y="24" width="78" height="24" rx="12" fill="#1e103c" stroke="#e879f9" stroke-opacity="0.6"/>
    <text x="307" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#f5d0fe">FLAGSHIP</text>

    <text x="24" y="84" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="21" fill="#f5f3ff">Vidyapeeth Platform</text>
    <text x="24" y="106" font-family="Consolas, monospace" font-size="12" fill="#e879f9">TypeScript · Next.js · React · Streaming</text>
    <line x1="24" y1="122" x2="344" y2="122" stroke="#8b5cf6" stroke-opacity="0.25"/>

    <text x="24" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">Multi-provider live coaching &amp; course</text>
    <text x="24" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">platform crafted for ultra-low latency</text>
    <text x="24" y="188" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">playback and distraction-free study.</text>

    <rect x="24" y="210" width="110" height="24" rx="6" fill="#0a0416" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="79" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#c4b5fd">⚡ 60FPS UI</text>
    <rect x="144" y="210" width="124" height="24" rx="6" fill="#0a0416" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="206" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#7dd3fc">✦ DESIGN SYSTEM</text>
  </g>

  <!-- ================= CARD 2: AI STUDY AGENT BOT ================= -->
  <g class="cardFloat2" transform="translate(416, 18)">
    <rect width="368" height="254" rx="18" fill="url(#fpCard)" stroke="url(#fpBorder2)" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="14" fill="#0c2a44" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="38" y="43" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#38bdf8">02</text>
    <rect x="260" y="24" width="86" height="24" rx="12" fill="#091e36" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="303" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#bae6fd">AI ENGINE</text>

    <text x="24" y="84" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="21" fill="#f5f3ff">AI Study Agent Bot</text>
    <text x="24" y="106" font-family="Consolas, monospace" font-size="12" fill="#38bdf8">Python · OpenAI · Async Automation</text>
    <line x1="24" y1="122" x2="344" y2="122" stroke="#38bdf8" stroke-opacity="0.25"/>

    <text x="24" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">Autonomous agent transforming lectures</text>
    <text x="24" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">&amp; videos into structured notes, mind</text>
    <text x="24" y="188" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">maps, flashcards &amp; interactive quizzes.</text>

    <rect x="24" y="210" width="118" height="24" rx="6" fill="#0a0416" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="83" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#7dd3fc">🤖 NEURAL NLP</text>
    <rect x="152" y="210" width="124" height="24" rx="6" fill="#0a0416" stroke="#e879f9" stroke-opacity="0.5"/>
    <text x="214" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#f5d0fe">⚙ AUTO PIPELINE</text>
  </g>

  <!-- ================= CARD 3: CLOUD & MEDIA BOT SUITE ================= -->
  <g class="cardFloat3" transform="translate(812, 18)">
    <rect width="368" height="254" rx="18" fill="url(#fpCard)" stroke="url(#fpBorder3)" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="14" fill="#062e1e" stroke="#39ff88" stroke-width="1.5"/>
    <text x="38" y="43" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#39ff88">03</text>
    <rect x="260" y="24" width="86" height="24" rx="12" fill="#06281c" stroke="#39ff88" stroke-opacity="0.6"/>
    <text x="303" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#bbf7d0">PRODUCTION</text>

    <text x="24" y="84" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="21" fill="#f5f3ff">Cloud Stream &amp; Sync</text>
    <text x="24" y="106" font-family="Consolas, monospace" font-size="12" fill="#39ff88">Python · Pyrogram · Docker · Redis</text>
    <line x1="24" y1="122" x2="344" y2="122" stroke="#39ff88" stroke-opacity="0.25"/>

    <text x="24" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">High-throughput cloud drive indexing,</text>
    <text x="24" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">real-time voice/video call audio bots</text>
    <text x="24" y="188" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">&amp; automated media processing workers.</text>

    <rect x="24" y="210" width="114" height="24" rx="6" fill="#0a0416" stroke="#39ff88" stroke-opacity="0.5"/>
    <text x="81" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#86efac">🚀 HIGH SCALE</text>
    <rect x="148" y="210" width="126" height="24" rx="6" fill="#0a0416" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="211" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#d8b4fe">🐳 DOCKERIZED</text>
  </g>
</svg>
