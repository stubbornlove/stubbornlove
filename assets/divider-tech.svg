<svg width="1200" height="60" viewBox="0 0 1200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="15%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="85%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .blink { animation: blink 2s ease-in-out infinite; }
      @keyframes blink { 0%,100%{ opacity:0.3;} 50%{ opacity:1;} }
    </style>
  </defs>
  <line x1="0" y1="30" x2="1200" y2="30" stroke="url(#techLine)" stroke-width="1.5"/>
  <g fill="#0a0616" stroke="url(#techLine)" stroke-width="1.5">
    <circle class="blink" cx="120" cy="30" r="5"/>
    <circle class="blink" cx="360" cy="30" r="5" style="animation-delay:0.4s"/>
    <circle class="blink" cx="600" cy="30" r="7"/>
    <circle class="blink" cx="840" cy="30" r="5" style="animation-delay:0.8s"/>
    <circle class="blink" cx="1080" cy="30" r="5" style="animation-delay:1.2s"/>
  </g>
  <g stroke="#a78bfa" stroke-opacity="0.4">
    <line x1="600" y1="10" x2="600" y2="50"/>
  </g>
</svg>
