<svg width="1000" height="58" viewBox="0 0 1000 58" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#190524" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#280834" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#190524" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tsBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>
    <style>
      .line1 { animation: cycle 12s infinite 0s; opacity: 0; }
      .line2 { animation: cycle 12s infinite 3s; opacity: 0; }
      .line3 { animation: cycle 12s infinite 6s; opacity: 0; }
      .line4 { animation: cycle 12s infinite 9s; opacity: 0; }
      @keyframes cycle {
        0% { opacity: 0; transform: translateY(6px); }
        4%, 21% { opacity: 1; transform: translateY(0px); }
        25%, 100% { opacity: 0; transform: translateY(-6px); }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="54" rx="27" fill="url(#tsBg)" stroke="url(#tsBorder)" stroke-width="1.5"/>

  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="16" letter-spacing="1.5" text-anchor="middle">
    <text class="line1" x="500" y="35" fill="#ffe4e6">❤️ "I want to be the parts of the book you underline..."</text>
    <text class="line2" x="500" y="35" fill="#fde047">✨ Architect by Mind  ·  Old-School Romantic by Soul</text>
    <text class="line3" x="500" y="35" fill="#7dd3fc">⚡ Building Luxury React / Next.js Interfaces &amp; AI Empires</text>
    <text class="line4" x="500" y="35" fill="#f5d0fe">🌙 Late-Night Drives, Lofi Rain &amp; 100% Genuine Effort</text>
  </g>
</svg>
