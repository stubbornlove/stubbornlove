<svg width="1200" height="215" viewBox="0 0 1200 215" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220629"/>
      <stop offset="50%" stop-color="#13041e"/>
      <stop offset="100%" stop-color="#07020e"/>
    </linearGradient>
    <linearGradient id="mnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="mnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="10" width="1160" height="195" rx="22" fill="url(#mnBg)" stroke="url(#mnBorder)" stroke-width="1.6"/>

  <!-- Top Pill -->
  <rect x="440" y="28" width="320" height="26" rx="13" fill="#2d0824" stroke="#ff2a85" stroke-opacity="0.6"/>
  <text x="600" y="45" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#fda4af">💌 IF YOU SCROLLED THIS FAR // 02:14 AM</text>

  <!-- Poetic Lines -->
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18.5" fill="#ffe4e6" filter="url(#mnGlow)">"Anyone can write code that works. I care about building things — and moments — that make your heart skip a beat."</text>
  <text x="600" y="124" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#fbcfe8">If you love deep conversations, sunset skies, undefeated aesthetics, or building empires together — you're in the right place.</text>

  <line x1="420" y1="146" x2="780" y2="146" stroke="#ff2a85" stroke-opacity="0.35"/>

  <text x="600" y="174" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="13" letter-spacing="3" fill="#fde047">— YOGESH MAHAWAR  ·  STUBBORNLOVE ❤️</text>
</svg>
