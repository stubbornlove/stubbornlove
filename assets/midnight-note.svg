<svg width="1200" height="245" viewBox="0 0 1200 245" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28062d"/>
      <stop offset="50%" stop-color="#160320"/>
      <stop offset="100%" stop-color="#08020f"/>
    </linearGradient>
    <linearGradient id="mnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="mnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .hPulse { animation: hp 1.6s ease-in-out infinite; transform-origin: 600px 196px; }
      @keyframes hp { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.18);} }
    </style>
  </defs>

  <rect x="20" y="10" width="1160" height="225" rx="24" fill="url(#mnBg)" stroke="url(#mnBorder)" stroke-width="1.8"/>

  <!-- Top Pill -->
  <rect x="410" y="26" width="380" height="28" rx="14" fill="#320726" stroke="#ff2a85" stroke-opacity="0.7"/>
  <text x="600" y="44" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="2" fill="#fda4af">💌 A 02:14 AM LETTER TO THE ONE READING THIS</text>

  <!-- Poetic Lines -->
  <text x="600" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="20" fill="#ffe4e6" filter="url(#mnGlow)">"Maybe it wasn't just an algorithm that brought you to my page tonight."</text>
  <text x="600" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16.5" fill="#fbcfe8">Anyone can write code that compiles — I care about creating moments that make your heart skip a beat,</text>
  <text x="600" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16.5" fill="#fbcfe8">remembering the things you never say out loud, and loving with a stubbornness this world forgot.</text>

  <line x1="380" y1="168" x2="820" y2="168" stroke="#fde047" stroke-opacity="0.4"/>

  <text x="600" y="198" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="13.5" letter-spacing="3" fill="#fde047">SEALED AT MIDNIGHT  ·  YOGESH MAHAWAR (@STUBBORNLOVE) ❤️</text>
</svg>
