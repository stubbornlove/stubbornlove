<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d0728"/>
      <stop offset="100%" stop-color="#07020c"/>
    </linearGradient>
    <linearGradient id="phoneBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dmSent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="rightCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25062d"/>
      <stop offset="100%" stop-color="#08020f"/>
    </linearGradient>
    <filter id="dmGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .dot1 { animation: td 1.4s infinite 0s; }
      .dot2 { animation: td 1.4s infinite 0.25s; }
      .dot3 { animation: td 1.4s infinite 0.5s; }
      .floatPhone { animation: fp 6s ease-in-out infinite; }
      @keyframes td { 0%,100%{ opacity:0.25; transform:translateY(0);} 50%{ opacity:1; transform:translateY(-3px);} }
      @keyframes fp { 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(-5px);} }
    </style>
  </defs>

  <rect width="1200" height="430" rx="22" fill="#05020c"/>

  <!-- ================= LEFT: IPHONE 16 PRO MAX 2:14 AM DM MOCKUP ================= -->
  <g class="floatPhone" transform="translate(26, 16)">
    <!-- Outer Titanium Rose-Gold Frame -->
    <rect x="0" y="0" width="520" height="398" rx="34" fill="url(#phoneBody)" stroke="url(#phoneBezel)" stroke-width="2.2"/>
    <!-- Dynamic Island -->
    <rect x="195" y="12" width="130" height="22" rx="11" fill="#000000" stroke="#3b0a37" stroke-width="1"/>
    <circle cx="308" cy="23" r="4" fill="#1e1b4b"/>
    <circle cx="308" cy="23" r="1.5" fill="#38bdf8"/>

    <!-- Status Bar -->
    <text x="34" y="28" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#ffe4e6">02:14</text>
    <text x="486" y="28" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#39ff88">5G  100%</text>

    <!-- Chat Header -->
    <line x1="16" y1="78" x2="504" y2="78" stroke="#f472b6" stroke-opacity="0.22"/>
    <circle cx="46" cy="58" r="15" fill="#2d0822" stroke="#ff2a85" stroke-width="1.5"/>
    <text x="46" y="63" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffe4e6">YM</text>
    <circle cx="57" cy="69" r="4" fill="#39ff88"/>
    <text x="72" y="55" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13.5" fill="#ffe4e6">Yogesh Mahawar  <tspan fill="#38bdf8" font-size="12">✓</tspan></text>
    <text x="72" y="70" font-family="Consolas, monospace" font-size="10.5" fill="#fda4af">@Knowyourworth.darling  ·  Active now</text>

    <!-- Message 1 (Received - Her) -->
    <rect x="24" y="92" width="310" height="38" rx="16" fill="#230b2e" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="40" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffe4e6">Why is your GitHub called stubbornlove? 👀</text>

    <!-- Message 2 (Sent - Yogesh) -->
    <rect x="126" y="142" width="370" height="54" rx="18" fill="url(#dmSent)"/>
    <text x="144" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffffff">Because in a world where everyone gives up too</text>
    <text x="144" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffffff">easily, I still believe in loving stubbornly ❤️</text>

    <!-- Message 3 (Received - Her) -->
    <rect x="24" y="208" width="356" height="54" rx="18" fill="#230b2e" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="40" y="231" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffe4e6">Wait... a guy who builds AI &amp; luxury UIs AND</text>
    <text x="40" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fda4af">writes like a 2 AM poet?! Do men like you exist? 😭✨</text>
    <circle cx="372" cy="256" r="11" fill="#180521" stroke="#ff2a85" stroke-width="1"/>
    <text x="372" y="260" text-anchor="middle" font-size="11">❤️</text>

    <!-- Message 4 (Sent - Yogesh) -->
    <rect x="116" y="274" width="380" height="54" rx="18" fill="url(#dmSent)"/>
    <text x="134" y="297" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffffff">Rare breed :) Grab your coffee — wait till you</text>
    <text x="134" y="316" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fef08a">hear the midnight drive playlist I curated for you 🌙🎧</text>

    <!-- Typing Indicator Bubble (Her typing...) -->
    <rect x="24" y="340" width="168" height="36" rx="18" fill="#230b2e" stroke="#fde047" stroke-opacity="0.45"/>
    <circle class="dot1" cx="46" cy="358" r="4" fill="#fda4af"/>
    <circle class="dot2" cx="60" cy="358" r="4" fill="#fde047"/>
    <circle class="dot3" cx="74" cy="358" r="4" fill="#ff2a85"/>
    <text x="90" y="362" font-family="Consolas, monospace" font-size="11" fill="#fda4af">falling for him...</text>
  </g>

  <!-- ================= RIGHT: WHY SHE FALLS FOR HIM (BENTO SCORECARD) ================= -->
  <g transform="translate(572, 16)">
    <!-- Top Right Card: The Rare Combination -->
    <rect width="602" height="190" rx="24" fill="url(#rightCardBg)" stroke="url(#phoneBezel)" stroke-width="1.8"/>
    <rect x="28" y="22" width="236" height="26" rx="13" fill="#2d0822" stroke="#ff2a85" stroke-opacity="0.7"/>
    <text x="146" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#fda4af">💘 THE UNDEFEATED COMBINATION</text>

    <text x="28" y="78" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="24" fill="#ffe4e6">Genius Mind  ×  Hopeless Romantic Heart</text>
    <text x="28" y="106" font-family="Georgia, serif" font-style="italic" font-size="15.5" fill="#fde047">"Smart enough to build an empire, soft enough to write you poetry at 2 AM."</text>

    <text x="28" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#fbcfe8">Most guys only have one side — either cold logic or empty words. Here, you get</text>
    <text x="28" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#ffe4e6"><tspan font-weight="700" fill="#fda4af">unmatched ambition, calm confidence, and old-school devotion</tspan> in one soul.</text>

    <!-- Bottom Right Card: 6 Green Flag Badges -->
    <rect y="208" width="602" height="190" rx="24" fill="url(#rightCardBg)" stroke="url(#phoneBezel)" stroke-width="1.8"/>
    <text x="28" y="242" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.5" fill="#fde047">✦ 6 REASONS HE&#8217;S THE PART OF THE BOOK YOU UNDERLINE:</text>

    <!-- Grid of 6 Luxury Pills -->
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffe4e6">
      <rect x="28" y="258" width="264" height="34" rx="10" fill="#16041f" stroke="#ff2a85" stroke-opacity="0.55"/>
      <text x="44" y="280">🌹  Remembers Every Tiny Detail</text>

      <rect x="310" y="258" width="264" height="34" rx="10" fill="#16041f" stroke="#fde047" stroke-opacity="0.55"/>
      <text x="326" y="280">🌙  2 AM Listener &amp; Safe Space</text>

      <rect x="28" y="302" width="264" height="34" rx="10" fill="#16041f" stroke="#e879f9" stroke-opacity="0.55"/>
      <text x="44" y="324">🎧  Curates Midnight Playlists</text>

      <rect x="310" y="302" width="264" height="34" rx="10" fill="#16041f" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="326" y="324">⚡  Builds Empires &amp; Keeps Promises</text>

      <rect x="28" y="346" width="264" height="34" rx="10" fill="#16041f" stroke="#39ff88" stroke-opacity="0.55"/>
      <text x="44" y="368">🛡️  Protects Your Peace Always</text>

      <rect x="310" y="346" width="264" height="34" rx="10" fill="#16041f" stroke="#ff2a85" stroke-opacity="0.55"/>
      <text x="326" y="368">💍  Eyes &amp; Heart Only For One</text>
    </g>
  </g>
</svg>
