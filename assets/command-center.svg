  <circle cx="358" cy="36" r="5.5" fill="#ff2a85"/>
  <circle cx="376" cy="36" r="5.5" fill="#fde047"/>
  <circle cx="394" cy="36" r="5.5" fill="#39ff88"/>
  <text x="600" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#fda4af">~/yogesh/soul_and_code.ts — midnight.zsh</text>

  <!-- Code Content -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="12.8">
    <text x="356" y="78" fill="#64748b">01</text>
    <text x="384" y="78" fill="#f472b6">const</text>
    <text x="428" y="78" fill="#fde047">yogesh</text>
    <text x="478" y="78" fill="#e2e8f0">: <tspan fill="#38bdf8">RareBreed</tspan> = {</text>

    <text x="356" y="103" fill="#64748b">02</text>
    <text x="400" y="103" fill="#93c5fd">name</text><text x="432" y="103" fill="#e2e8f0">:</text>
    <text x="446" y="103" fill="#ffe4e6">"Yogesh Mahawar"</text><text x="568" y="103" fill="#e2e8f0">,</text>

