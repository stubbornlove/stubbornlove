    <text x="404" y="210" fill="#93c5fd">craft</text><text x="444" y="210" fill="#e2e8f0">: [</text>
    <text x="468" y="210" fill="#38bdf8">"Design Systems"</text><text x="590" y="210" fill="#e2e8f0">, </text>
