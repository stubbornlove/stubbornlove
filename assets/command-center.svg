  </circle>
  <text x="930" y="50" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="2" fill="#fda4af">CURRENTLY IN ELEMENT</text>
  <text x="908" y="84" font-family="'Segoe UI', Georgia, serif" font-weight="800" font-size="21" fill="#ffe4e6">Building &amp; Dreaming</text>
  <text x="908" y="108" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">Turning late-night coffee into</text>
  <text x="908" y="126" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">art, code &amp; unforgettable vibes.</text>
  <rect x="908" y="138" width="252" height="28" rx="14" fill="#0b0316" stroke="#fde047" stroke-opacity="0.5"/>
  <text x="1034" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#fde047">✨ OPEN TO WORK &amp; GOOD VIBES</text>

  <!-- Right Bottom Card: Stats -->
  <rect x="884" y="200" width="300" height="174" rx="20" fill="url(#bentoBg)" stroke="url(#bentoBorder)" stroke-width="1.5"/>
  <text x="908" y="228" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2.5" fill="#fde047">✦ CHARACTER ATTRIBUTES</text>

  <!-- Bar 1 -->
  <text x="908" y="254" font-family="Consolas, monospace" font-size="11.5" fill="#ffe4e6">Romance &amp; Aesthetic</text>
  <text x="1160" y="254" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#ff2a85">100%</text>
  <rect x="908" y="261" width="252" height="7" rx="3.5" fill="#240b36"/>
  <rect x="908" y="261" width="252" height="7" rx="3.5" fill="url(#barRose)"/>

  <!-- Bar 2 -->
  <text x="908" y="294" font-family="Consolas, monospace" font-size="11.5" fill="#ffe4e6">Ambition &amp; Intellect</text>
  <text x="1160" y="294" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#fde047">99%</text>
  <rect x="908" y="301" width="252" height="7" rx="3.5" fill="#240b36"/>
  <rect x="908" y="301" width="249" height="7" rx="3.5" fill="url(#barGold)"/>

  <!-- Bar 3 -->
  <text x="908" y="334" font-family="Consolas, monospace" font-size="11.5" fill="#ffe4e6">Loyalty &amp; Consistency</text>
  <text x="1160" y="334" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">∞ MAX</text>
  <rect x="908" y="341" width="252" height="7" rx="3.5" fill="#240b36"/>
  <rect x="908" y="341" width="252" height="7" rx="3.5" fill="url(#barCyan)"/>
