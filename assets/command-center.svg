    <text x="400" y="128" fill="#93c5fd">byDay</text><text x="440" y="128" fill="#e2e8f0">:</text>
    <text x="454" y="128" fill="#38bdf8">"Building luxury UIs &amp; AI systems ⚡"</text><text x="720" y="128" fill="#e2e8f0">,</text>

    <text x="356" y="153" fill="#64748b">04</text>
    <text x="400" y="153" fill="#93c5fd">byNight</text><text x="454" y="153" fill="#e2e8f0">:</text>
    <text x="468" y="153" fill="#fda4af">"Late-night drives, lofi rain &amp; poetry 🌙"</text><text x="772" y="153" fill="#e2e8f0">,</text>

    <text x="356" y="178" fill="#64748b">05</text>
    <text x="400" y="178" fill="#93c5fd">superpower</text><text x="476" y="178" fill="#e2e8f0">:</text>
    <text x="490" y="178" fill="#fde047">"Noticing the tiny details others miss"</text><text x="776" y="178" fill="#e2e8f0">,</text>

    <text x="356" y="203" fill="#64748b">06</text>
    <text x="400" y="203" fill="#93c5fd">greenFlags</text><text x="476" y="203" fill="#e2e8f0">: [</text>
    <text x="496" y="203" fill="#39ff88">"Loyal"</text><text x="548" y="203" fill="#e2e8f0">, </text>
    <text x="560" y="203" fill="#39ff88">"Calm under chaos"</text><text x="692" y="203" fill="#e2e8f0">, </text>
    <text x="704" y="203" fill="#39ff88">"Great taste"</text><text x="798" y="203" fill="#e2e8f0">],</text>

    <text x="356" y="228" fill="#64748b">07</text>
    <text x="400" y="228" fill="#93c5fd">loveLanguage</text><text x="490" y="228" fill="#e2e8f0">:</text>
    <text x="504" y="228" fill="#e879f9">"Remembering everything you once mentioned"</text><text x="818" y="228" fill="#e2e8f0">,</text>

    <text x="356" y="253" fill="#64748b">08</text>
    <text x="400" y="253" fill="#93c5fd">rule</text><text x="432" y="253" fill="#e2e8f0">:</text>
    <text x="446" y="253" fill="#ff2a85">"Never half-love. Never ship ugly. ❤️"</text>

    <text x="356" y="278" fill="#64748b">09</text>
    <text x="384" y="278" fill="#e2e8f0">};</text>
  </g>

  <!-- Terminal Prompt Bar -->
  <rect x="354" y="304" width="492" height="46" rx="12" fill="#07020f" stroke="#ff2a85" stroke-opacity="0.45"/>
  <text x="372" y="332" font-family="Consolas, monospace" font-size="13" fill="#ff2a85">♥</text>
  <text x="394" y="332" font-family="Consolas, monospace" font-size="13" fill="#fde047">~/stubbornlove</text>
  <text x="512" y="332" font-family="Consolas, monospace" font-size="13" fill="#ffe4e6">making_the_world_a_little_more_beautiful</text>
  <rect class="cursor" x="808" y="318" width="8" height="17" fill="#ff2a85"/>

