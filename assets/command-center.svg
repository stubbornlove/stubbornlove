<svg width="1200" height="390" viewBox="0 0 1200 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19072c" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#070210" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="bentoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="barRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .cursor { animation: blink 1.1s step-end infinite; }
      .pulseCore { animation: pCore 2s ease-in-out infinite; transform-origin: 166px 172px; }
      @keyframes blink { 0%,100%{ opacity:1;} 50%{ opacity:0;} }
      @keyframes pCore { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="390" rx="18" fill="#05020c"/>

  <!-- ================= LEFT CARD: CELESTIAL AURA & HEART CORE ================= -->
  <rect x="16" y="16" width="300" height="358" rx="20" fill="url(#bentoBg)" stroke="url(#bentoBorder)" stroke-width="1.5"/>
  <text x="166" y="46" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#fda4af">✦ CELESTIAL AURA CORE ✦</text>

  <circle cx="166" cy="172" r="98" fill="url(#coreGlow)"/>
  <circle cx="166" cy="172" r="90" fill="none" stroke="#fde047" stroke-width="1.2" stroke-dasharray="4 10" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 166 172" to="360 166 172" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="166" cy="172" r="74" fill="none" stroke="#ff2a85" stroke-width="2.2" stroke-dasharray="65 160" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="360 166 172" to="0 166 172" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="166" cy="172" r="56" fill="none" stroke="#e879f9" stroke-width="1.5" stroke-dasharray="22 14" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" from="0 166 172" to="360 166 172" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="166" cy="172" r="40" fill="#0c0318" stroke="url(#bentoBorder)" stroke-width="2"/>
  <text class="pulseCore" x="166" y="181" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-weight="900" font-size="25" letter-spacing="1.5" fill="#ffe4e6" filter="url(#glow)">YM</text>

  <!-- Core Telemetry Readouts -->
  <line x1="38" y1="286" x2="294" y2="286" stroke="#f472b6" stroke-opacity="0.28"/>
  <text x="42" y="310" font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">VIBE CHECK:</text>
  <text x="290" y="310" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#fda4af">100% HUSBAND MATERIAL</text>
  <text x="42" y="334" font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">AESTHETIC LEVEL:</text>
  <text x="290" y="334" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#fde047">PINTEREST × 2035</text>
  <text x="42" y="356" font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">HEART STATUS:</text>
  <text x="290" y="356" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#39ff88">DEEP &amp; STUBBORN ❤️</text>

