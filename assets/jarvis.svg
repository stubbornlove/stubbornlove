<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="jGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="120" fill="url(#coreGlow)"/>

  <g fill="none" stroke="url(#ringGrad1)" stroke-width="1.4" opacity="0.75">
    <circle cx="160" cy="160" r="128" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="none" stroke="url(#ringGrad2)" stroke-width="2" opacity="0.85" filter="url(#jGlow)">
    <circle cx="160" cy="160" r="104" stroke-dasharray="70 400">
      <animateTransform attributeName="transform" type="rotate" from="360 160 160" to="0 160 160" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.5">
    <circle cx="160" cy="160" r="86">
      <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#c4b5fd" stroke-width="1.5" opacity="0.6">
    <line x1="160" y1="20" x2="160" y2="38"/>
    <line x1="160" y1="282" x2="160" y2="300"/>
    <line x1="20" y1="160" x2="38" y2="160"/>
    <line x1="282" y1="160" x2="300" y2="160"/>
  </g>

  <circle cx="160" cy="160" r="46" fill="none" stroke="url(#ringGrad1)" stroke-width="2.5" filter="url(#jGlow)"/>
  <circle cx="160" cy="160" r="30" fill="#0a0414" stroke="#e879f9" stroke-width="1.5"/>
  <circle cx="160" cy="160" r="14" fill="#e879f9" filter="url(#jGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <circle r="5" fill="#38bdf8" filter="url(#jGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 160,44 A 116,116 0 1 1 159.9,44"/>
  </circle>

  <text x="160" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="3" fill="#a78bfa" opacity="0.7">SYSTEM ONLINE</text>
</svg>
