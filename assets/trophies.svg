<svg width="1200" height="230" viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170a34"/>
      <stop offset="100%" stop-color="#070312"/>
    </linearGradient>
    <linearGradient id="trGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="trPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="trCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="trGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="230" rx="16" fill="#050310"/>

  <!-- Trophy 1: SSS UI Architect -->
  <g transform="translate(18, 15)">
    <rect width="182" height="200" rx="16" fill="url(#trCard)" stroke="#e879f9" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="91" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#e879f9">RANK // SSS</text>
    <circle cx="91" cy="86" r="34" fill="#1e0b3b" stroke="url(#trPink)" stroke-width="2" filter="url(#trGlow)"/>
    <text x="91" y="96" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="26" fill="url(#trPink)">👑</text>
    <text x="91" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#f5f3ff">UI Architect</text>
    <text x="91" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#a78bfa">Design Systems</text>
    <rect x="41" y="178" width="100" height="6" rx="3" fill="#e879f9"/>
  </g>

  <!-- Trophy 2: SS+ AI Automator -->
  <g transform="translate(214, 15)">
    <rect width="182" height="200" rx="16" fill="url(#trCard)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="91" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#38bdf8">RANK // SS+</text>
    <circle cx="91" cy="86" r="34" fill="#08243b" stroke="url(#trCyan)" stroke-width="2" filter="url(#trGlow)"/>
    <text x="91" y="96" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="26" fill="url(#trCyan)">🤖</text>
    <text x="91" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#f5f3ff">AI Automator</text>
    <text x="91" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#7dd3fc">Neural Workflows</text>
    <rect x="41" y="178" width="100" height="6" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Trophy 3: SS Repo Builder -->
  <g transform="translate(410, 15)">
    <rect width="182" height="200" rx="16" fill="url(#trCard)" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="91" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#c084fc">RANK // SS</text>
    <circle cx="91" cy="86" r="34" fill="#1e0b3b" stroke="#a855f7" stroke-width="2" filter="url(#trGlow)"/>
    <text x="91" y="96" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="26" fill="#f5f3ff">🚀</text>
    <text x="91" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#f5f3ff">20+ Repositories</text>
    <text x="91" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#c4b5fd">Full-Stack Shipper</text>
    <rect x="41" y="178" width="100" height="6" rx="3" fill="#a855f7"/>
  </g>

  <!-- Trophy 4: S+ Community Magnet -->
  <g transform="translate(606, 15)">
    <rect width="182" height="200" rx="16" fill="url(#trCard)" stroke="#39ff88" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="91" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#39ff88">RANK // S+</text>
    <circle cx="91" cy="86" r="34" fill="#06291b" stroke="#39ff88" stroke-width="2" filter="url(#trGlow)"/>
    <text x="91" y="96" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="26" fill="#39ff88">🌟</text>
    <text x="91" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#f5f3ff">45+ Followers</text>
    <text x="91" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#86efac">Growing Network</text>
    <rect x="41" y="178" width="100" height="6" rx="3" fill="#39ff88"/>
  </g>

  <!-- Trophy 5: S+ Pixel Perfection -->
  <g transform="translate(802, 15)">
    <rect width="182" height="200" rx="16" fill="url(#trCard)" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="91" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#fde047">RANK // S+</text>
    <circle cx="91" cy="86" r="34" fill="#2b1905" stroke="url(#trGold)" stroke-width="2" filter="url(#trGlow)"/>
    <text x="91" y="96" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="26" fill="#fde047">⚡</text>
    <text x="91" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#f5f3ff">60FPS Craft</text>
    <text x="91" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#fde68a">Zero-Jank Motion</text>
    <rect x="41" y="178" width="100" height="6" rx="3" fill="#f59e0b"/>
  </g>

  <!-- Trophy 6: S 2035 Pioneer -->
  <g transform="translate(998, 15)">
    <rect width="184" height="200" rx="16" fill="url(#trCard)" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="92" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#60a5fa">RANK // S</text>
    <circle cx="92" cy="86" r="34" fill="#0b1d3a" stroke="#60a5fa" stroke-width="2" filter="url(#trGlow)"/>
    <text x="92" y="96" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="26" fill="#60a5fa">💎</text>
    <text x="92" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#f5f3ff">2035 Ready</text>
    <text x="92" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#93c5fd">Next-Gen Builder</text>
    <rect x="42" y="178" width="100" height="6" rx="3" fill="#60a5fa"/>
  </g>
</svg>
