<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="velvetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040109"/>
      <stop offset="30%" stop-color="#110422"/>
      <stop offset="65%" stop-color="#1e0631"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>
    <radialGradient id="auroraRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#be185d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#6b21a8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="luxTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="22%" stop-color="#fda4af"/>
      <stop offset="45%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#e879f9"/>
      <stop offset="90%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roseGoldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0"/>
      <stop offset="25%" stop-color="#fb7185" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fde047" stop-opacity="1"/>
      <stop offset="75%" stop-color="#e879f9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff2a85" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#fda4af" stop-opacity="1"/>
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#260c3d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b0316" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="starGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#f472b6" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="24" cy="24" r="0.8" fill="#fda4af" fill-opacity="0.22"/>
    </pattern>
    <filter id="luxGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b1"/>
      <feGaussianBlur stdDeviation="3" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .orbA { animation: driftA 9s ease-in-out infinite; }
      .orbB { animation: driftB 11s ease-in-out infinite; }
      .orbC { animation: driftC 7s ease-in-out infinite; }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .heartBeat { animation: pulseHeart 1.4s ease-in-out infinite; transform-origin: 600px 142px; }
      .comet1 { animation: shoot1 6s linear infinite; }
      .comet2 { animation: shoot2 8.5s linear infinite 2.5s; }
      @keyframes driftA { 0%,100%{ transform:translate(0px,0px);} 50%{ transform:translate(30px,-20px);} }
      @keyframes driftB { 0%,100%{ transform:translate(0px,0px);} 50%{ transform:translate(-30px,22px);} }
      @keyframes driftC { 0%,100%{ opacity:0.5;} 50%{ opacity:0.95;} }
      @keyframes twinkle { 0%,100%{ opacity:0.2; transform:scale(0.85);} 50%{ opacity:1; transform:scale(1.3);} }
      @keyframes pulseHeart { 0%,100%{ transform:scale(1);} 15%{ transform:scale(1.22);} 30%{ transform:scale(0.96);} 45%{ transform:scale(1.14);} }
      @keyframes shoot1 { 0%{ transform:translate(0,0); opacity:0;} 10%{ opacity:1;} 35%{ transform:translate(320px,140px); opacity:0;} 100%{ opacity:0;} }
      @keyframes shoot2 { 0%{ transform:translate(0,0); opacity:0;} 10%{ opacity:1;} 35%{ transform:translate(-340px,150px); opacity:0;} 100%{ opacity:0;} }
    </style>
  </defs>

  <!-- Velvet Night Background -->
  <rect width="1200" height="480" rx="22" fill="url(#velvetBg)"/>
  <rect width="1200" height="480" rx="22" fill="url(#starGrid)"/>

  <!-- Romantic Aurora Clouds -->
  <circle class="orbA" cx="240" cy="140" r="260" fill="url(#auroraRose)"/>
  <circle class="orbB" cx="960" cy="320" r="270" fill="url(#auroraViolet)"/>
  <circle class="orbC" cx="600" cy="215" r="230" fill="url(#auroraGold)"/>

  <!-- Shooting Stars (Comets) -->
  <g class="comet1">
    <line x1="120" y1="40" x2="185" y2="68" stroke="#fda4af" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)"/>
    <circle cx="185" cy="68" r="2.5" fill="#ffffff"/>
  </g>
  <g class="comet2">
    <line x1="1060" y1="50" x2="995" y2="78" stroke="#e879f9" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)"/>
    <circle cx="995" cy="78" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Starlight Constellation Dots -->
  <g fill="#ffe4e6">
    <circle class="star" cx="80" cy="80" r="2"/>
    <circle class="star" cx="155" cy="190" r="1.5" style="animation-delay:0.5s"/>
    <circle class="star" cx="275" cy="72" r="2.2" style="animation-delay:1.1s"/>
    <circle class="star" cx="420" cy="58" r="1.4" style="animation-delay:1.7s"/>
    <circle class="star" cx="790" cy="64" r="1.9" style="animation-delay:0.8s"/>
    <circle class="star" cx="935" cy="82" r="2.3" style="animation-delay:1.4s"/>
    <circle class="star" cx="1110" cy="95" r="1.7" style="animation-delay:0.3s"/>
    <circle class="star" cx="1065" cy="240" r="1.8" style="animation-delay:2.0s"/>
    <circle class="star" cx="130" cy="340" r="1.6" style="animation-delay:1.2s"/>
    <circle class="star" cx="1050" cy="365" r="1.9" style="animation-delay:0.9s"/>
  </g>

  <!-- Top Luxury Status Bar -->
  <rect x="28" y="20" width="1144" height="38" rx="19" fill="#0c041a" fill-opacity="0.82" stroke="#f472b6" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="52" cy="39" r="5" fill="#ff2a85" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="68" y="43" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="2" fill="#fda4af">HEARTBEAT: ACTIVE</text>
  <text x="600" y="43" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="3.5" fill="#fde047">✦ YOGESH MAHAWAR  ·  ARCHITECT BY MIND, POET BY SOUL ✦</text>
  <text x="1148" y="43" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="2" fill="#e879f9">@STUBBORNLOVE ♥</text>

  <!-- Animated ECG Heartbeat Wave + Glowing Center Heart -->
  <path d="M 100,142 L 470,142 L 490,126 L 508,162 L 528,104 L 548,176 L 566,134 L 580,142 L 620,142 L 634,134 L 652,176 L 672,104 L 692,162 L 710,126 L 730,142 L 1100,142" fill="none" stroke="url(#ecgGrad)" stroke-width="2.2" filter="url(#softGlow)"/>
  <text class="heartBeat" x="600" y="150" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#ff2a85" filter="url(#luxGlow)">❤️</text>

  <!-- Main Centerpiece Title: STUBBORNLOVE -->
  <text x="600" y="242" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-weight="900" font-size="86" letter-spacing="14" fill="#ff2a85" opacity="0.28" filter="url(#luxGlow)">STUBBORNLOVE</text>
  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-weight="900" font-size="86" letter-spacing="14" fill="url(#luxTitle)" filter="url(#softGlow)">STUBBORNLOVE</text>

  <!-- Signature Romantic Quote -->
  <text x="600" y="286" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" letter-spacing="1.5" fill="#ffe4e6" filter="url(#softGlow)">"I want to be the parts of the book you underline ❤️"</text>

  <!-- Role & Craft Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="14" letter-spacing="4.5" fill="#f472b6">YOGESH MAHAWAR  <tspan fill="#fde047">✦</tspan>  FRONTEND ARCHITECT  <tspan fill="#fde047">✦</tspan>  CREATIVE ENGINEER</text>

  <line x1="180" y1="344" x2="1020" y2="344" stroke="url(#roseGoldLine)" stroke-width="1.5" opacity="0.8"/>

  <!-- Bottom 5 Luxury Velvet Glass Pills -->
  <g transform="translate(88, 372)" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="1.5">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="194" height="40" rx="20" fill="url(#glassPill)" stroke="#ff2a85" stroke-opacity="0.65" stroke-width="1.3"/>
    <text x="97" y="25" text-anchor="middle" fill="#ffe4e6">🌹 OLD-SCHOOL SOUL</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="198" height="40" rx="20" fill="url(#glassPill)" stroke="#e879f9" stroke-opacity="0.65" stroke-width="1.3"/>
    <text x="309" y="25" text-anchor="middle" fill="#fae8ff">✨ LUXURY UI CRAFT</text>

    <!-- Pill 3 -->
    <rect x="424" y="0" width="194" height="40" rx="20" fill="url(#glassPill)" stroke="#fde047" stroke-opacity="0.65" stroke-width="1.3"/>
    <text x="521" y="25" text-anchor="middle" fill="#fef9c3">⚡ 10X BUILDER &amp; AI</text>

    <!-- Pill 4 -->
    <rect x="634" y="0" width="194" height="40" rx="20" fill="url(#glassPill)" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.3"/>
    <text x="731" y="25" text-anchor="middle" fill="#e0f2fe">🎧 MIDNIGHT LOFI</text>

    <!-- Pill 5 -->
    <rect x="844" y="0" width="180" height="40" rx="20" fill="url(#glassPill)" stroke="#39ff88" stroke-opacity="0.65" stroke-width="1.3"/>
    <text x="934" y="25" text-anchor="middle" fill="#dcfce7">💎 RARE BREED</text>
  </g>

  <!-- Subtle Bottom Caption -->
  <text x="600" y="446" text-anchor="middle" font-family="Consolas, monospace" font-size="11" letter-spacing="3" fill="#fda4af" opacity="0.75">HALF LOGIC  ·  HALF POETRY  ·  100% UNFORGETTABLE</text>

  <!-- Outer Velvet Rose-Gold Frame -->
  <rect x="1.5" y="1.5" width="1197" height="477" rx="22" fill="none" stroke="url(#roseGoldLine)" stroke-width="2"/>
</svg>
