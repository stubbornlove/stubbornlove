<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030d"/>
      <stop offset="45%" stop-color="#12082b"/>
      <stop offset="75%" stop-color="#1c0b3d"/>
      <stop offset="100%" stop-color="#050310"/>
    </linearGradient>
    <radialGradient id="heroGlowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="65%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e879f9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="heroGrid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#8b5cf6" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <style>
      .float1 { animation: float1 6s ease-in-out infinite; }
      .float2 { animation: float2 7.5s ease-in-out infinite; }
      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      .scan { animation: scan 4.5s linear infinite; }
      .twinkle { animation: twinkle 2.6s ease-in-out infinite; }
      @keyframes float1 { 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(-14px);} }
      @keyframes float2 { 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(12px);} }
      @keyframes pulse { 0%,100%{ opacity:0.55; } 50%{ opacity:1; } }
      @keyframes scan { 0%{ transform:translateY(-420px);} 100%{ transform:translateY(420px);} }
      @keyframes twinkle { 0%,100%{ opacity:0.15;} 50%{ opacity:0.9;} }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#heroBg)"/>
  <rect width="1200" height="420" fill="url(#heroGrid)"/>

  <circle class="float1" cx="220" cy="120" r="180" fill="url(#heroGlowPurple)"/>
  <circle class="float2" cx="1000" cy="300" r="200" fill="url(#heroGlowBlue)"/>

  <g clip-path="none">
    <rect class="scan" x="0" y="-420" width="1200" height="3" fill="#e879f9" opacity="0.12"/>
  </g>

  <g fill="#c4b5fd">
    <circle class="twinkle" cx="90" cy="60" r="2"/>
    <circle class="twinkle" cx="180" cy="340" r="1.6" style="animation-delay:0.6s"/>
    <circle class="twinkle" cx="340" cy="90" r="1.8" style="animation-delay:1.1s"/>
    <circle class="twinkle" cx="1080" cy="80" r="2" style="animation-delay:0.3s"/>
    <circle class="twinkle" cx="1140" cy="220" r="1.6" style="animation-delay:1.4s"/>
    <circle class="twinkle" cx="960" cy="360" r="1.8" style="animation-delay:0.9s"/>
    <circle class="twinkle" cx="60" cy="240" r="1.5" style="animation-delay:1.8s"/>
    <circle class="twinkle" cx="620" cy="40" r="1.6" style="animation-delay:0.4s"/>
  </g>

  <line x1="240" y1="150" x2="960" y2="150" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.7"/>

  <text x="600" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="104" letter-spacing="14" fill="url(#titleGrad)" filter="url(#softGlow)">STUBBORN</text>

  <text x="600" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="21" letter-spacing="5" fill="#a78bfa" opacity="0.9">FRONTEND ENGINEER // UI SYSTEMS ARCHITECT</text>

  <line x1="300" y1="300" x2="900" y2="300" stroke="url(#lineGrad)" stroke-width="1" opacity="0.5"/>

  <g font-family="Consolas, monospace" font-size="13" fill="#7dd3fc" opacity="0.85" letter-spacing="3">
    <text x="600" y="335" text-anchor="middle">[ REACT ]  [ TYPESCRIPT ]  [ NEXT.JS ]  [ NODE ]  [ AWS ]</text>
  </g>

  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="url(#titleGrad)" stroke-opacity="0.12" stroke-width="3" filter="url(#softGlow)"/>
</svg>
