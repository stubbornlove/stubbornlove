<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04020a"/>
      <stop offset="35%" stop-color="#0d0522"/>
      <stop offset="65%" stop-color="#170936"/>
      <stop offset="100%" stop-color="#050310"/>
    </linearGradient>
    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.50"/>
      <stop offset="55%" stop-color="#7e22ce" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="25%" stop-color="#e879f9"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e879f9" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e103c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090416" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="cyberGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#a855f7" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="44" cy="44" r="1" fill="#38bdf8" fill-opacity="0.18"/>
    </pattern>
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .orb1 { animation: floatOrb1 8s ease-in-out infinite; }
      .orb2 { animation: floatOrb2 10s ease-in-out infinite; }
      .orb3 { animation: floatOrb3 7s ease-in-out infinite; }
      .scanline { animation: scan 6s linear infinite; }
      .twinkle { animation: twinkle 3s ease-in-out infinite; }
      .titlePulse { animation: titlePulse 4s ease-in-out infinite; }
      .eq1 { animation: eq 1.4s ease-in-out infinite; transform-origin: center bottom; }
      .eq2 { animation: eq 1.9s ease-in-out infinite 0.3s; transform-origin: center bottom; }
      .eq3 { animation: eq 1.2s ease-in-out infinite 0.6s; transform-origin: center bottom; }
      @keyframes floatOrb1 { 0%,100%{ transform:translate(0px, 0px);} 50%{ transform:translate(25px, -18px);} }
      @keyframes floatOrb2 { 0%,100%{ transform:translate(0px, 0px);} 50%{ transform:translate(-30px, 16px);} }
      @keyframes floatOrb3 { 0%,100%{ opacity:0.45;} 50%{ opacity:0.85;} }
      @keyframes scan { 0%{ transform:translateY(-460px);} 100%{ transform:translateY(460px);} }
      @keyframes twinkle { 0%,100%{ opacity:0.15; transform:scale(0.9);} 50%{ opacity:0.95; transform:scale(1.2);} }
      @keyframes titlePulse { 0%,100%{ opacity:0.95;} 50%{ opacity:1;} }
      @keyframes eq { 0%,100%{ opacity:0.35;} 50%{ opacity:1;} }
    </style>
  </defs>

  <!-- Base Void & Cyber Grid -->
  <rect width="1200" height="460" rx="18" fill="url(#heroBg)"/>
  <rect width="1200" height="460" rx="18" fill="url(#cyberGrid)"/>

  <!-- Ambient Nebula Orbs -->
  <circle class="orb1" cx="200" cy="130" r="240" fill="url(#nebulaPurple)"/>
  <circle class="orb2" cx="1000" cy="310" r="260" fill="url(#nebulaCyan)"/>
  <circle class="orb3" cx="600" cy="210" r="220" fill="url(#nebulaPink)"/>

  <!-- Perspective 3D Horizon Grid at Bottom -->
  <g stroke="#a855f7" stroke-opacity="0.16" stroke-width="1">
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="432" x2="1200" y2="432"/>
    <line x1="600" y1="330" x2="80" y2="460"/>
    <line x1="600" y1="330" x2="280" y2="460"/>
    <line x1="600" y1="330" x2="460" y2="460"/>
    <line x1="600" y1="330" x2="600" y2="460"/>
    <line x1="600" y1="330" x2="740" y2="460"/>
    <line x1="600" y1="330" x2="920" y2="460"/>
    <line x1="600" y1="330" x2="1120" y2="460"/>
  </g>

  <!-- Starfield -->
  <g fill="#e9d5ff">
    <circle class="twinkle" cx="85" cy="78" r="1.8"/>
    <circle class="twinkle" cx="165" cy="290" r="1.5" style="animation-delay:0.7s"/>
    <circle class="twinkle" cx="295" cy="95" r="2.2" style="animation-delay:1.3s"/>
    <circle class="twinkle" cx="440" cy="68" r="1.4" style="animation-delay:0.4s"/>
    <circle class="twinkle" cx="780" cy="72" r="1.8" style="animation-delay:1.8s"/>
    <circle class="twinkle" cx="940" cy="105" r="2.0" style="animation-delay:0.9s"/>
    <circle class="twinkle" cx="1095" cy="88" r="1.7" style="animation-delay:0.2s"/>
    <circle class="twinkle" cx="1125" cy="275" r="1.9" style="animation-delay:1.5s"/>
    <circle class="twinkle" cx="990" cy="340" r="1.5" style="animation-delay:2.1s"/>
    <circle class="twinkle" cx="110" cy="200" r="1.4" style="animation-delay:1.1s"/>
  </g>

  <!-- Laser Scanline -->
  <rect class="scanline" x="0" y="0" width="1200" height="2" fill="url(#lineGrad)" opacity="0.35"/>

  <!-- Top Telemetry HUD Bar -->
  <rect x="24" y="18" width="1152" height="36" rx="10" fill="#090415" fill-opacity="0.78" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="46" cy="36" r="4.5" fill="#39ff88" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="40" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="2" fill="#39ff88">SYS.ONLINE</text>
  <text x="160" y="40" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="1.5" fill="#a78bfa">// ID: YOGESH_MAHAWAR</text>
  <text x="600" y="40" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="3" fill="#cbd5e1" opacity="0.8">╔══  STUBBORNLOVE.DEV // QUANTUM HUD v2035.4  ══╗</text>
  <text x="1154" y="40" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="2" fill="#38bdf8">LOC: INDIA [IST +5:30]</text>

  <!-- Corner HUD Reticles -->
  <g stroke="#e879f9" stroke-width="2" fill="none" opacity="0.75">
    <path d="M 26 78 L 26 64 L 44 64"/>
    <path d="M 1174 78 L 1174 64 L 1156 64"/>
    <path d="M 26 422 L 26 436 L 44 436"/>
    <path d="M 1174 422 L 1174 436 L 1156 436"/>
  </g>

  <!-- Left & Right Audio/Telemetry Bars -->
  <g fill="#a855f7" opacity="0.7">
    <rect class="eq1" x="42" y="185" width="4" height="36" rx="2" fill="#e879f9"/>
    <rect class="eq2" x="50" y="170" width="4" height="66" rx="2" fill="#a855f7"/>
    <rect class="eq3" x="58" y="192" width="4" height="22" rx="2" fill="#38bdf8"/>
    <rect class="eq1" x="66" y="178" width="4" height="50" rx="2" fill="#e879f9"/>

    <rect class="eq2" x="1130" y="178" width="4" height="50" rx="2" fill="#e879f9"/>
    <rect class="eq3" x="1138" y="192" width="4" height="22" rx="2" fill="#38bdf8"/>
    <rect class="eq1" x="1146" y="170" width="4" height="66" rx="2" fill="#a855f7"/>
    <rect class="eq2" x="1154" y="185" width="4" height="36" rx="2" fill="#e879f9"/>
  </g>

  <!-- Crown Tag -->
  <rect x="370" y="82" width="460" height="28" rx="14" fill="#14092b" fill-opacity="0.85" stroke="url(#borderGrad)" stroke-width="1"/>
  <text x="600" y="100" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="3.5" fill="#e879f9">✦ ARCHITECTING NEXT-GEN INTERFACES ✦</text>

  <!-- Main Glowing Title: STUBBORN -->
  <line x1="180" y1="130" x2="1020" y2="130" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.75"/>

  <!-- Shadow / Glow Layer -->
  <text x="600" y="232" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="900" font-size="108" letter-spacing="18" fill="#a855f7" opacity="0.28" filter="url(#neonGlow)">STUBBORN</text>
  <!-- Crisp Gradient Foreground Layer -->
  <text class="titlePulse" x="600" y="230" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="900" font-size="108" letter-spacing="18" fill="url(#titleGrad)" filter="url(#softGlow)">STUBBORN</text>

  <!-- Subtitle & Identity -->
  <text x="600" y="278" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="18.5" letter-spacing="5.5" fill="#f5f3ff">YOGESH MAHAWAR  <tspan fill="#e879f9">//</tspan>  FRONTEND &amp; AI SYSTEMS ENGINEER</text>
  <text x="600" y="304" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" letter-spacing="1.5" fill="#a78bfa" opacity="0.92">Building interfaces that feel like the future is already here — precise, fast, quietly luxurious.</text>

  <line x1="220" y1="326" x2="980" y2="326" stroke="url(#lineGrad)" stroke-width="1.2" opacity="0.65"/>

  <!-- Bottom Glassmorphic Tech Pills -->
  <g transform="translate(115, 352)" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="1.5">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="38" rx="10" fill="url(#pillFill)" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="4" fill="#38bdf8"/>
    <text x="98" y="23" text-anchor="middle" fill="#e0f2fe">REACT &amp; NEXT.JS</text>

    <!-- Pill 2 -->
    <rect x="196" y="0" width="170" height="38" rx="10" fill="url(#pillFill)" stroke="#a855f7" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="216" cy="19" r="4" fill="#a855f7"/>
    <text x="290" y="23" text-anchor="middle" fill="#f3e8ff">TYPESCRIPT</text>

    <!-- Pill 3 -->
    <rect x="382" y="0" width="194" height="38" rx="10" fill="url(#pillFill)" stroke="#e879f9" stroke-opacity="0.65" stroke-width="1.2"/>
    <circle cx="402" cy="19" r="4" fill="#e879f9"/>
    <text x="488" y="23" text-anchor="middle" fill="#fae8ff">UI DESIGN SYSTEMS</text>

    <!-- Pill 4 -->
    <rect x="592" y="0" width="186" height="38" rx="10" fill="url(#pillFill)" stroke="#39ff88" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="612" cy="19" r="4" fill="#39ff88"/>
    <text x="694" y="23" text-anchor="middle" fill="#dcfce7">PYTHON &amp; AI BOTS</text>

    <!-- Pill 5 -->
    <rect x="794" y="0" width="176" height="38" rx="10" fill="url(#pillFill)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="814" cy="19" r="4" fill="#60a5fa"/>
    <text x="890" y="23" text-anchor="middle" fill="#dbeafe">CLOUD &amp; DOCKER</text>
  </g>

  <!-- Outer Frame -->
  <rect x="1.5" y="1.5" width="1197" height="457" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
</svg>
